[project]
name = "kgqa-agent"
version = "0.1.0"
description = "SPARQL-generation agent benchmark (rdf-mcp), wired to sparql-relax-mcp for query diagnosis instead of the local greedy-pruning implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devtools>=0.12.2",
    "mcp[cli]>=1.6.0",
    "oxrdflib>=0.4.0",
    "pandas>=3.0.0",
    "pydantic-ai>=0.1.3",
    "pyyaml>=6.0.2",
    "rdflib>=7.1.4",
    "sentence-transformers>=5.2.0",
    "sparql-relax-mcp",
    "sparql-relax-rs",
]

# sparql-relax-mcp declares its own dependency on sparql-relax-rs via a `../sparql-relax-py`
# path source (relative to its position inside the lazlop/sparql-relax monorepo), which isn't
# reliably picked up transitively once pulled in as a git dependency here -- so both packages
# are pinned to the same monorepo explicitly. Building sparql-relax-rs requires a Rust toolchain
# the first time (cached by uv/maturin after that).
[tool.uv.sources]
sparql-relax-mcp = { git = "https://github.com/lazlop/sparql-relax", subdirectory = "sparql-relax-mcp" }
sparql-relax-rs = { git = "https://github.com/lazlop/sparql-relax", subdirectory = "sparql-relax-py" }

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.2.0",
]
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''
