[project]
name = "kgqa-agent"
version = "0.1.0"
description = "SPARQL-generation agent benchmark (rdf-mcp), wired to sparql-relax-mcp for query diagnosis instead of the local greedy-pruning implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devtools>=0.12.2",
    "mcp[cli]>=1.6.0",
    "oxrdflib>=0.4.0",
    "pandas>=3.0.0",
    "pydantic-ai>=0.1.3",
    "pyyaml>=6.0.2",
    "rdflib>=7.1.4",
    "sentence-transformers>=5.2.0",
    "sparql-relax-mcp",
    "sparql-relax-rs",
    "bschema-rs",
]

# sparql-relax-mcp moved out of the lazlop/sparql-relax monorepo into its own repo
# (lazlop/kgqa-tools) on 2026-07-27; it still declares its own git dependency on
# sparql-relax-rs (subdirectory=sparql-relax-py in lazlop/sparql-relax), pinned to the same
# source here too for reproducibility. bschema-rs (the create-bschema-rs CLI used to
# regenerate data/bschema/*.ttl) lives in its own repo too. Building sparql-relax-rs/bschema-rs
# requires a Rust toolchain the first time (cached by uv/maturin after that).
[tool.uv.sources]
sparql-relax-mcp = { git = "https://github.com/lazlop/kgqa-tools" }
sparql-relax-rs = { git = "https://github.com/lazlop/sparql-relax", subdirectory = "sparql-relax-py" }
bschema-rs = { git = "https://github.com/lazlop/bschema", subdirectory = "bschema-py" }

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.2.0",
]
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''
